<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Akxyverse logo">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b18"/>
      <stop offset="100%" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="65%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="48" fill="url(#logoBg)"/>

  <!-- hub-and-spoke mark: central node with 6 orbiting nodes -->
  <g stroke-width="2.5" opacity="0.85">
    <line x1="120" y1="120" x2="120" y2="55" stroke="#38bdf8"/>
    <line x1="120" y1="120" x2="176" y2="88" stroke="#22d3ee"/>
    <line x1="120" y1="120" x2="176" y2="152" stroke="#a78bfa"/>
    <line x1="120" y1="120" x2="120" y2="185" stroke="#d946ef"/>
    <line x1="120" y1="120" x2="64"  y2="152" stroke="#f0abfc"/>
    <line x1="120" y1="120" x2="64"  y2="88"  stroke="#5eead4"/>
  </g>

  <circle cx="120" cy="120" r="16" fill="url(#spectrum)"/>
  <g fill="#f8fafc">
    <circle cx="120" cy="55" r="8"/>
    <circle cx="176" cy="88" r="8"/>
    <circle cx="176" cy="152" r="8"/>
    <circle cx="120" cy="185" r="8"/>
    <circle cx="64" cy="152" r="8"/>
    <circle cx="64" cy="88" r="8"/>
  </g>
</svg>
