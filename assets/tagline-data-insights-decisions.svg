<svg viewBox="0 0 1000 120" width="1000" height="120" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Data to Insights to Decisions">
  <title>DATA — INSIGHTS — DECISIONS</title>
  <desc>Akash Yadav's analytics pipeline: data becomes insights, insights become decisions.</desc>

  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050810"/>
      <stop offset="50%"  stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="tflow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="50%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="tglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- One halo per stage so each highlight glows in its own accent while
         using the identical treatment: same radius logic, same opacity ramp. -->
    <radialGradient id="tglowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity=".42"/>
      <stop offset="60%"  stop-color="#38bdf8" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tglowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity=".42"/>
      <stop offset="60%"  stop-color="#22d3ee" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tglowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity=".42"/>
      <stop offset="60%"  stop-color="#a78bfa" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="tgrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#16304d" stroke-width=".5" stroke-opacity=".5"/>
    </pattern>

    <filter id="tsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      /* Every word is painted at full opacity in the base state, so if a
         renderer ignores CSS the complete message still reads
         DATA -> INSIGHTS -> DECISIONS. Animation only adds emphasis.

         Delays are NEGATIVE on purpose. With a positive delay an element
         sits in its BASE state until the delay elapses, so INSIGHTS and
         DECISIONS rendered permanently bright for the first 3s and 6s and
         looked favoured over DATA. A negative delay starts each stage
         already mid-cycle, so all three share one identical 9s rotation and
         each gets the same 1.6s in the spotlight. */
      .stage      { animation: cycle 9s ease-in-out infinite; }
      .s2         { animation-delay: -6s; }
      .s3         { animation-delay: -3s; }
      .halo       { opacity: 0; animation: halo 9s ease-in-out infinite; }
      .h2         { animation-delay: -6s; }
      .h3         { animation-delay: -3s; }
      .spark      { animation: spark 9s linear infinite; }
      .p2         { animation-delay: -6s; }
      .p3         { animation-delay: -3s; }
      .drift      { animation: drift 6s ease-in-out infinite alternate; }
      .d2         { animation-delay: -4s; }
      .d3         { animation-delay: -2s; }

      @keyframes cycle {
        0%,  4%  { opacity: .62; }
        11%, 29% { opacity: 1; }
        36%,100% { opacity: .62; }
      }
      @keyframes halo {
        0%,  4%  { opacity: 0; }
        13%, 27% { opacity: 1; }
        36%,100% { opacity: 0; }
      }
      @keyframes spark {
        0%   { opacity: 0; transform: translateX(0); }
        8%   { opacity: 1; }
        30%  { opacity: 1; }
        34%  { opacity: 0; transform: translateX(300px); }
        100% { opacity: 0; transform: translateX(300px); }
      }
      @keyframes drift {
        from { transform: translateY(0); }
        to   { transform: translateY(-5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage, .halo, .spark, .drift { animation: none; }
        .stage { opacity: 1; }
        .halo, .spark { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1000" height="120" rx="10" fill="url(#tbg)"/>
  <rect width="1000" height="120" rx="10" fill="url(#tgrid)"/>
  <ellipse cx="500" cy="60" rx="420" ry="70" fill="url(#tglow)"/>

  <!-- connecting pipeline -->
  <line x1="250" y1="62" x2="750" y2="62" stroke="url(#tflow)"
        stroke-width="1.4" stroke-opacity=".45" stroke-dasharray="4 6"/>

  <!-- travelling particles, one per hand-off -->
  <g fill="#22d3ee">
    <circle class="spark"    cx="255" cy="62" r="2.6"/>
    <circle class="spark p2" cx="575" cy="62" r="2.6" fill="#a78bfa"/>
    <circle class="spark p3" cx="255" cy="62" r="2.2" opacity=".5"/>
  </g>

  <!-- arrows -->
  <g fill="#334f70">
    <path d="M336 58 l9 4 -9 4 z"/>
    <path d="M656 58 l9 4 -9 4 z"/>
  </g>

  <g font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">

    <!-- ── DATA ─────────────────────────────────────────────────── -->
    <g class="stage">
      <circle class="halo" cx="170" cy="62" r="54" fill="url(#tglowB)"/>
      <!-- raw data: a small table with a header row and two populated cells,
           feeding three minimal bars -->
      <g class="drift" opacity=".9">
        <rect x="147" y="21" width="27" height="19" rx="2"
              fill="none" stroke="#38bdf8" stroke-width="1.1" opacity=".75"/>
        <rect x="147" y="21" width="27" height="5.5" rx="2" fill="#38bdf8" opacity=".35"/>
        <g stroke="#38bdf8" stroke-width=".7" opacity=".45">
          <line x1="156" y1="21" x2="156" y2="40"/>
          <line x1="165" y1="21" x2="165" y2="40"/>
          <line x1="147" y1="33" x2="174" y2="33"/>
        </g>
        <g fill="#7dd3fc">
          <rect x="149" y="28.5" width="5" height="2.5" rx="1"/>
          <rect x="167" y="35" width="5" height="2.5" rx="1"/>
        </g>
        <g fill="#38bdf8">
          <rect x="180" y="32" width="3.4" height="8"  rx="1.2" opacity=".65"/>
          <rect x="185.5" y="27" width="3.4" height="13" rx="1.2" opacity=".85"/>
          <rect x="191" y="30" width="3.4" height="10" rx="1.2" opacity=".7"/>
        </g>
      </g>
      <text x="170" y="74" font-size="27" font-weight="700" letter-spacing="5"
            fill="#38bdf8">DATA</text>
      <text x="170" y="94" font-size="10" font-weight="500" letter-spacing="2.4"
            fill="#64809f">COLLECT · CLEAN</text>
    </g>

    <!-- ── INSIGHTS ─────────────────────────────────────────────── -->
    <g class="stage s2">
      <circle class="halo h2" cx="500" cy="62" r="54" fill="url(#tglowC)"/>
      <!-- analysis: a trend line under examination, with the significant
           point picked out beneath the lens -->
      <g class="drift d2" opacity=".9">
        <polyline points="478,38 486,33 494,35 502,27 510,30 520,22"
                  fill="none" stroke="#22d3ee" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
        <circle cx="502" cy="27" r="2.4" fill="#67e8f9"/>
        <circle cx="504" cy="28" r="8.5" fill="#0a1020" fill-opacity=".35"
                stroke="#22d3ee" stroke-width="1.8"/>
        <line x1="510" y1="34" x2="516" y2="40" stroke="#22d3ee"
              stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="500" y="74" font-size="27" font-weight="700" letter-spacing="5"
            fill="#22d3ee">INSIGHTS</text>
      <text x="500" y="94" font-size="10" font-weight="500" letter-spacing="2.4"
            fill="#64809f">ANALYSE · MODEL</text>
    </g>

    <!-- ── DECISIONS ────────────────────────────────────────────── -->
    <g class="stage s3">
      <circle class="halo h3" cx="825" cy="62" r="54" fill="url(#tglowV)"/>
      <!-- business impact: a clean upward trend arriving on target -->
      <g class="drift d3" opacity=".9">
        <polyline points="801,39 810,33 818,35 828,26" fill="none"
                  stroke="#a78bfa" stroke-width="1.9"
                  stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#a78bfa" opacity=".5">
          <rect x="799" y="36" width="3" height="4" rx="1"/>
          <rect x="808" y="33" width="3" height="7" rx="1"/>
          <rect x="817" y="34" width="3" height="6" rx="1"/>
        </g>
        <circle cx="838" cy="23" r="7.5" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
        <circle cx="838" cy="23" r="3.6" fill="none" stroke="#a78bfa" stroke-width="1.3" opacity=".7"/>
        <circle cx="838" cy="23" r="1.5" fill="#c4b5fd"/>
      </g>
      <text x="825" y="74" font-size="27" font-weight="700" letter-spacing="5"
            fill="#a78bfa">DECISIONS</text>
      <text x="825" y="94" font-size="10" font-weight="500" letter-spacing="2.4"
            fill="#64809f">ACT · MEASURE</text>
    </g>
  </g>

  <rect x="0" y="117" width="1000" height="3" rx="1.5" fill="url(#tflow)" opacity=".6"/>
</svg>
