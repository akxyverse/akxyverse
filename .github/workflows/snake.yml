name: Generate Snake Animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allow manually triggering the workflow
  workflow_dispatch:

  # regenerate whenever the profile README changes
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake animation from akxyverse's contribution graph
      # (GIF output, not SVG-only: the SVG variant's CSS keyframe trail
      # animation doesn't survive GitHub's render pipeline and shows up
      # as a solid green bar instead of an animated snake)
      - name: generate github-contribution-grid-snake.gif
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark

      # push the generated svg to the output branch, served via raw.githubusercontent.com
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
